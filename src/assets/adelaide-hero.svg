<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="40%" stop-color="#3B82F6"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="hillsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E4D3E"/>
      <stop offset="100%" stop-color="#0F2D24"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="600" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="850" cy="300" r="90" fill="#FEF08A" opacity="0.9"/>
  <circle cx="850" cy="300" r="140" fill="#FDE047" opacity="0.25"/>

  <!-- Adelaide Hills Silhouette -->
  <path d="M 0 380 Q 250 290 500 340 T 950 310 Q 1100 270 1200 320 L 1200 600 L 0 600 Z" fill="url(#hillsGrad)" opacity="0.95"/>
  <path d="M 0 410 Q 300 350 600 380 T 1200 360 L 1200 600 L 0 600 Z" fill="#133E31"/>

  <!-- City Skyline Silhouette (Adelaide CBD & North Terrace) -->
  <rect x="220" y="320" width="35" height="120" fill="#0F172A" rx="2"/>
  <rect x="265" y="280" width="48" height="160" fill="#1E293B" rx="3"/>
  <polygon points="289,240 270,280 308,280" fill="#334155"/>
  <rect x="325" y="310" width="40" height="130" fill="#0F172A" rx="2"/>
  <rect x="380" y="270" width="55" height="170" fill="#1E293B" rx="3"/>
  <!-- Adelaide Oval canopy shape -->
  <path d="M 450 410 C 470 330 530 330 550 410 Z" fill="#E2E8F0" opacity="0.9"/>
  <path d="M 460 410 C 480 345 520 345 540 410 Z" fill="#0F2D24"/>
  <rect x="560" y="330" width="45" height="110" fill="#1E293B" rx="2"/>
  <rect x="620" y="295" width="50" height="145" fill="#334155" rx="3"/>
  <!-- St Peter Cathedral Spire -->
  <polygon points="695,260 685,350 705,350" fill="#F8FAFC" opacity="0.85"/>
  <rect x="682" y="350" width="26" height="70" fill="#1E293B"/>

  <!-- Torrens Footbridge Arch -->
  <path d="M 380 470 Q 550 410 720 470" stroke="#F1F5F9" stroke-width="8" fill="none"/>
  <path d="M 400 472 L 400 482 M 460 455 L 460 482 M 550 440 L 550 482 M 640 455 L 640 482 M 700 472 L 700 482" stroke="#CBD5E1" stroke-width="3"/>

  <!-- River Torrens Water -->
  <path d="M 0 470 Q 300 460 600 480 T 1200 470 L 1200 600 L 0 600 Z" fill="url(#waterGrad)"/>

  <!-- River reflections -->
  <ellipse cx="850" cy="520" rx="90" ry="12" fill="#FEF08A" opacity="0.4"/>
  <ellipse cx="550" cy="510" rx="160" ry="8" fill="#F8FAFC" opacity="0.3"/>

  <!-- Native Black Swan on River -->
  <path d="M 320 520 C 330 505 345 500 355 508 C 360 512 365 525 350 528 C 335 530 325 528 320 520 Z" fill="#09090B"/>
  <circle cx="355" cy="505" r="4" fill="#09090B"/>
  <polygon points="359,505 367,506 359,508" fill="#EF4444"/>

  <!-- Adelaide Parklands Foreshore -->
  <path d="M 0 540 Q 350 520 700 550 T 1200 530 L 1200 600 L 0 600 Z" fill="#14532D"/>

  <!-- Foreground Eucalyptus Trees -->
  <g transform="translate(80, 420)">
    <path d="M 30 140 L 30 70 Q 30 30 15 0 Q 35 30 45 70 L 45 140 Z" fill="#422006"/>
    <ellipse cx="15" cy="30" rx="35" ry="25" fill="#15803D" opacity="0.9"/>
    <ellipse cx="40" cy="15" rx="30" ry="20" fill="#166534" opacity="0.95"/>
  </g>
</svg>
